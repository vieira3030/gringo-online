<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gringo Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== ENTRADA ========== -->
<div id="landing">
  <div class="landing-card">
    <div class="suits-deco"><span class="r">♥</span><span>♠</span><span class="r">♦</span><span>♣</span></div>
    <h1>Gringo</h1>
    <p class="sub">Jogo de cartas online · 2 a 6 jogadores</p>
    <label class="field">
      <span>O teu nome</span>
      <input id="nameInput" maxlength="16" placeholder="Ex.: André" autocomplete="off">
    </label>
    <button id="createBtn" class="btn primary lg">Criar sala nova</button>
    <div class="divider"><span>ou entra numa sala</span></div>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="CÓDIGO" class="code-input" autocomplete="off">
      <button id="joinBtn" class="btn secondary">Entrar</button>
    </div>
    <div id="joinError" class="form-error"></div>
    <button class="link-btn" data-open-rules>Como se joga?</button>
  </div>
</div>

<!-- ========== JOGO ========== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-logo">♠</span>Gringo</div>
    <div class="room-chip">
      <span class="muted">Sala</span> <b id="roomCode">----</b>
      <button id="copyBtn" class="chip-btn" title="Copiar link da sala">Copiar link</button>
    </div>
    <div class="spacer"></div>
    <div id="roundInfo" class="round-info"></div>
    <div id="conn" class="conn ok" title="Ligado ao servidor"><i></i><span>Ligado</span></div>
    <button id="soundBtn" class="icon-btn" title="Som"></button>
    <button class="icon-btn" data-open-rules title="Regras">?</button>
  </header>

  <div class="layout">
    <main class="table-area">
      <div id="opponents" class="opponents"></div>

      <div class="felt">
        <div id="lobbyPanel" class="lobby-panel hidden"></div>
        <div id="piles" class="piles">
          <div class="pile">
            <div id="deck" class="pile-slot"></div>
            <div class="pile-label">Baralho · <span id="deckCount">0</span></div>
          </div>
          <div class="pile">
            <div id="discard" class="pile-slot"></div>
            <div class="pile-label">Mesa</div>
          </div>
          <div class="pile" id="drawnPile">
            <div id="drawn" class="pile-slot"></div>
            <div class="pile-label" id="drawnLabel">Carta tirada</div>
          </div>
        </div>
        <div id="gringoBanner" class="gringo-banner hidden"></div>
      </div>

      <div id="prompt" class="prompt"></div>

      <section id="mySeat" class="my-seat">
        <div class="seat-head">
          <div id="myAvatar" class="avatar"></div>
          <div>
            <div class="seat-name" id="myName"></div>
            <div class="seat-sub" id="mySub"></div>
          </div>
          <div class="spacer"></div>
          <div id="myBadges" class="badges"></div>
        </div>
        <div id="myHand" class="hand mine"></div>
        <div id="actions" class="actions"></div>
      </section>
    </main>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Classificação</div>
        <div id="scoreList" class="score-list"></div>
      </div>
      <div class="panel grow">
        <div class="panel-title">Atividade</div>
        <div id="log" class="log"></div>
      </div>
      <div class="panel values">
        <div class="panel-title">Valores</div>
        <div class="values-grid">
          <span>A</span><b>1</b>
          <span>2–10</span><b>valor</b>
          <span>J · Q</span><b>10</b>
          <span class="red">K♥ K♦</span><b class="good">−3</b>
          <span>K♠ K♣</span><b>10</b>
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- ========== AVISOS E JANELAS ========== -->
<div id="toasts" class="toasts"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" title="Fechar">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<template id="rulesTpl">
  <h2>Como se joga o Gringo</h2>
  <p class="lead">Objetivo: acabar a ronda com <b>menos pontos</b> possível.</p>
  <div class="rules">
    <div class="rule"><div class="rule-ico">👀</div><div><b>Início</b><br>Cada jogador recebe 4 cartas viradas para baixo e pode ver 2 à escolha. Memoriza-as!</div></div>
    <div class="rule"><div class="rule-ico">🂠</div><div><b>Na tua vez</b><br>Tira uma carta do baralho (só tu a vês). Troca-a por uma das tuas ou joga-a na mesa.</div></div>
    <div class="rule"><div class="rule-ico">🃏</div><div><b>Par</b><br>Se tiras uma carta e sabes que tens outra igual, podes jogar as duas de uma vez (uma cobre a outra). Se te enganares, apanhas uma carta sem ver.</div></div>
    <div class="rule"><div class="rule-ico">⚡</div><div><b>Cobrir</b><br>Quando alguém joga uma carta (por ex. um 6) e sabes onde tens um 6, clica nele para o pôr por cima. Ficas com menos uma carta. Se te enganares, a carta volta para ti e apanhas uma sem ver.</div></div>
    <div class="rule"><div class="rule-ico">🔒</div><div><b>Só uma vez</b><br>Se alguém já cobriu, quem cobrir a seguir volta a ficar com a carta e apanha mais uma sem ver. (O anfitrião pode permitir cobrir várias vezes.)</div></div>
    <div class="rule"><div class="rule-ico">🎯</div><div><b>Cobrir com a carta de outro</b><br>Se sabes que outro jogador tem um 6, clica no 6 dele e depois numa carta tua: o 6 dele cobre a mesa e ele fica com a tua carta. Ficas com menos uma. Se não for um 6, apanhas uma carta sem ver.</div></div>
    <div class="rule"><div class="rule-ico">♛</div><div><b>Dama (Q)</b> — tiras e jogas na mesa: podes ver uma das tuas cartas.</div></div>
    <div class="rule"><div class="rule-ico">♞</div><div><b>Valete (J)</b> — tiras e jogas na mesa: trocas uma carta tua com uma de outro jogador, sem ver nenhuma das duas.</div></div>
    <div class="rule"><div class="rule-ico">♚</div><div><b>Rei (K)</b> — tiras e jogas na mesa: vês uma carta de outro jogador e decides se a trocas por uma tua.</div></div>
    <div class="rule"><div class="rule-ico">📣</div><div><b>Gringo</b><br>Na tua vez, em vez de jogar. As tuas cartas ficam bloqueadas, os outros jogam mais uma vez e mostram-se todas as cartas.</div></div>
    <div class="rule"><div class="rule-ico">🏁</div><div><b>Sem cartas</b><br>Se alguém ficar sem cartas, contam-se os pontos (por defeito os outros ainda jogam mais uma vez; o anfitrião pode mudar).</div></div>
  </div>
  <div class="values-row">
    <span>A = 1</span><span>2–10 = valor</span><span>J, Q = 10</span><span class="red">K♥ K♦ = −3</span><span>K♠ K♣ = 10</span>
  </div>
</template>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
